# MoveIt uses this configuration for controller management

controller_manager:
  ros__parameters:
    update_rate: 20 #Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster 

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - arm_link1_joint
      - arm_link2_joint
      - arm_link3_joint
      - arm_link4_joint
      - arm_link5_joint
      - arm_link6_joint       
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    interpolate_from_desired_state: true
    set_last_command_interface_value_as_state_on_activation: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.05
    gains:
      arm_link1_joint:
        p: 0.5
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
      arm_link2_joint:
        p: 0.5
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
      arm_link3_joint:
        p: 0.5
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
      arm_link4_joint:
        p: 0.5
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
      arm_link5_joint:
        p: 0.5
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0
      arm_link6_joint:
        p: 0.5
        i: 0.0
        d: 0.0
        i_clamp: 0.0
        ff_velocity_scale: 1.0 