controller_manager:
  ros__parameters:
    update_rate: 100 #Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster 

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    flipper_controller:
      type: flipper_controller/FlipperController

    drive_controller:
      type: drive_controller/DriveController

    #chain_controller:
    #  type: diff_drive_controller/DiffDriveController

arm_controller:
  ros__parameters:
    joints:
      - arm_link1_joint
      - arm_link2_joint
      - arm_link3_joint
      - arm_link4_joint
      - arm_link5_joint
      - arm_link6_joint       
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    interpolate_from_desired_state: true
    set_last_command_interface_value_as_state_on_activation: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.05
