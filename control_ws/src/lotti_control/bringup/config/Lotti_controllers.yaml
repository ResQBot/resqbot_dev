flipper_controller:
  ros__parameters:
    joints:
    - flipper_fr_joint
    - flipper_fl_joint
    - flipper_rr_joint
    - flipper_rl_joint
    command_interfaces:
    - velocity
    state_interfaces:
    - position

drive_controller:
  ros__parameters:
    joints:
    - left_chain_joint
    - right_chain_joint
    command_interfaces:
    - velocity
    state_interfaces:
    - velocity
    - position

